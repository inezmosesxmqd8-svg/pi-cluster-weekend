version: 2.1

jobs:
  round1_check-quick-integration-tests:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: soak
          command: |
            mkdir -p /tmp/e2
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=10000;i++) {h=0; s=sprintf("%d",i); for(j=1;j<=length(s);j++) h += substr(s,j,1)+0; print i,h}}' > /tmp/e2/ii.log; true
            echo "task done ($(wc -c </tmp/e2/ii.log) bytes written)"
      - persist_to_workspace:
          root: /tmp/e2
          paths:
            - ii.log
  check-quick-integration-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/e2
      - run:
          name: End check
          command: |
            hexdump -s 10 -n 20 /tmp/e2/big_task_output_v2.log 2>/dev/null || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 3 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xzvf content.tgz
      - run:
          name: Hash artifacts
          command: mkdir -p artifacts
      - run:
          command: ls -la
      - run:
          no_output_timeout: 99m
          command: /bin/sh -c "./check"
  Beta_bun-fmt:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/e2
      - run:
          name: flaky bits
          command: |
            mkdir -p /tmp/e2
            { set +o pipefail 2>/dev/null; seq 1 500 | awk 'END{print NR}'; true ; } > /tmp/e2/xd.pkg
            echo "task done ($(wc -c </tmp/e2/xd.pkg) bytes written)"
      - persist_to_workspace:
          root: /tmp/e2
          paths:
            - xd.pkg
